name: Daily Stock Checker

on:
  workflow_dispatch: 
  schedule:
    # 規則一：台灣時間 09:00 到 12:50 (UTC 1:00 到 4:50)，每 10 分鐘執行一次
    - cron: '*/10 1-4 * * 1-5'
    
    # 規則二：台灣時間 13:00 到 13:30 (UTC 5:00 到 5:30)，每 10 分鐘執行一次
    - cron: '0,10,20,30 5 * * 1-5'

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
